[workspace]
resolver = "3"
members = ["crates/seam-proto", "crates/seam-transport", "crates/seam-cli", "crates/seam-input"]

[workspace.package]
version = "0.8.3"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/amor-openmind/seam"
authors = ["seam contributors"]

[workspace.lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# The motion hot path must not allocate and must not be tail-call-hostile.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.bench]
debug = true
